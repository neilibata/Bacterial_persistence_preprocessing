# =========================================================================
# config.yaml — Pipeline configuration
# =========================================================================
# Edit this file directly, or regenerate it by running: bash setup.sh
# =========================================================================

# --- Input files ---
samples_tsv: "resources/samples.tsv"
reference_fasta: "resources/reference_metagenome.fna"
contig_to_species: "resources/contig_to_species.tsv"

# --- Output ---
results_dir: "results"

# --- SLURM ---
# FASRC Cannon: shared = 48c/172GB (3.6 GB/core), sapphire = 112c/990GB
# (8.8 GB/core), serial_requeue = preemptible but far more slots. Retries plus
# rerun-incomplete make preemption cheap for the short rules.
partition_cpu: "shared"
partition_shared: "serial_requeue"
partition_download: "serial_requeue"

# Where memory-hungry rules (align, repair) send large samples.
partition_bigmem: "sapphire"

# Inputs above this size (MB) go to partition_bigmem. The sample distribution is
# heavily skewed: most are ~12 Gbp but a handful reach 90 Gbp, and sizing
# everything for the tail wastes allocation while sizing for the median OOMs it.
big_sample_mb: 15000

slurm_account: ""
max_jobs: 500

# --- Parameters ---
mapq_threshold: 30
prefetch_max_size: "300G"

# Bowtie2 scales sub-linearly past ~16 threads, so more concurrent jobs beats
# more threads per job. 6 of these go to the samtools pipe, not bowtie2.
align_threads: 16
preprocess_threads: 8

# Alignment memory is flat in sample size: the resident bowtie2 index dominates
# and reads are streamed. Raise this if your reference catalogue is much larger
# than ~4,000 genomes.
align_mem_mb: 40000

# --- Intermediate file cleanup ---
# The pipeline automatically deletes intermediate files after downstream
# rules succeed, keeping only the important checkpoints.
#
# CLEANUP CHAIN:
#   raw FASTQs         → deleted after trimming
#   trimmed reads      → deleted after PhiX removal
#   PhiX-cleaned       → deleted after human removal
#   human-cleaned      → deleted after repair
#   repaired reads     → KEPT by default    (keep_repaired_reads)
#   aligned BAMs       → deleted after MAPQ filtering
#   filtered BAMs      → KEPT by default    (keep_filtered_bams)
#   ★ coverage files   → ALWAYS KEPT
#   ★ aggregated CSVs  → ALWAYS KEPT
#   ★ final matrices   → ALWAYS KEPT
#
# --- PROFILES ---
#
# Development / exploratory (default):
#   keep_all: false | keep_repaired_reads: true | keep_filtered_bams: true
#   Peak disk: ~10x raw data. Repaired reads + filtered BAMs persist for
#   re-analysis, re-alignment, or other projects.
#
# Production / large-scale (18,000+ samples):
#   keep_all: false | keep_repaired_reads: false | keep_filtered_bams: false
#   Also consider: align_threads: 8, preprocess_threads: 4, max_jobs: 990
#
# Debugging:
#   keep_all: true
#   Nothing is deleted. Uses ~10x more disk than production.

# Set to true to keep ALL intermediate files:
keep_all: false

# Repaired reads are useful as a re-alignment checkpoint and for other projects.
# Set to false to delete them after alignment (saves ~4GB per sample):
keep_repaired_reads: true

# Filtered BAMs (high/low MAPQ) are useful for downstream analysis.
# Set to false to delete them after coverage extraction:
keep_filtered_bams: true
