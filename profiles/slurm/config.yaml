# Snakemake 8/9 SLURM profile
# Requires: pip install snakemake-executor-plugin-slurm

executor: slurm
jobs: 200
latency-wait: 120
keep-going: true
rerun-incomplete: true
printshellcmds: true

# Activate conda in every child SLURM job so tools are in PATH.
# setup.sh will auto-detect your conda path and fill this in.
# If you installed conda elsewhere, update the path below:
# precommand: "source ~/miniconda3/etc/profile.d/conda.sh && conda activate bact_evo_pipeline"

default-resources:
  - slurm_partition=shared
  - mem_mb=4000
  - runtime=60
